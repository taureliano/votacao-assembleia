server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/votacao;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-numbers-for-enums: true
      accept-float-as-int: false
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  callback-base-url: ${CALLBACK_BASE_URL:http://localhost:8080}
  cpf:
    enabled: ${CPF_ENABLED:false}
    base-url: ${CPF_BASE_URL:https://user-info.herokuapp.com}

logging:
  level:
    root: INFO
    br.com.desafio.votacao: DEBUG
    org.springframework.web: DEBUG
