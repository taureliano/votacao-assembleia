services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: votacao
      POSTGRES_USER: votacao
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votacao -d votacao"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/votacao
      DB_USER: votacao
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      CALLBACK_BASE_URL: ${CALLBACK_BASE_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
